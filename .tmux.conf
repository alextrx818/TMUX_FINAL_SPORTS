# Tmux configuration for TMUX_FINAL_SPORTS project

# Change prefix key to Ctrl-a (easier to type)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config file easily
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Enable mouse support
set -g mouse on

# Start windows and panes at index 1 (easier navigation)
set -g base-index 1
set -g pane-base-index 1

# Split panes more intuitively
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim-style keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable vi mode for copy mode
setw -g mode-keys vi

# Status bar customization
set -g status-bg black
set -g status-fg white
set -g status-interval 15

# Window status format
setw -g window-status-current-style bg=red,fg=white,bold
setw -g window-status-style bg=black,fg=white

# Set terminal title
set -g set-titles on
set -g set-titles-string '#T - #W'

# History limit
set -g history-limit 10000

# No delay for escape key press
set -sg escape-time 0